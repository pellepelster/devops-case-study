apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-alerts
spec:
  groups:
    - name: service-requests
      rules:
        - alert: BackendApiHighErrorRate
          expr: |
            sum(rate(backend_api_requests_total{exported_endpoint!~"/health|/ready|/metrics", status=~"5.."}[5m]))
            /
            sum(rate(backend_api_requests_total{exported_endpoint!~"/health|/ready|/metrics"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
            service: backend-api
          annotations:
            summary: "backend-api: {{ $value | humanizePercentage }} of requests fail with 5xx"
        - alert: BackendApiElevatedErrorRate
          expr: |
            sum(rate(backend_api_requests_total{exported_endpoint!~"/health|/ready|/metrics", status=~"5.."}[30m]))
            /
            sum(rate(backend_api_requests_total{exported_endpoint!~"/health|/ready|/metrics"}[30m]))
            > 0.01
          for: 5m
          labels:
            severity: warning
            service: backend-api
          annotations:
            summary: "backend-api: sustained {{ $value | humanizePercentage }} 5xx responses over 30m"
        - alert: BackendApiHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(backend_api_request_duration_seconds_bucket{exported_endpoint!~"/health|/ready|/metrics"}[5m]))
            ) > 0.25
          for: 10m
          labels:
            severity: warning
            service: backend-api
          annotations:
            summary: "backend-api: p95 request latency is {{ $value | humanizeDuration }}"
        - alert: BackendApiNoTraffic
          expr: |
            sum(rate(backend_api_requests_total{exported_endpoint!~"/health|/ready|/metrics"}[5m])) == 0
            or
            absent(backend_api_requests_total{exported_endpoint!~"/health|/ready|/metrics"})
          for: 5m
          labels:
            severity: warning
            service: backend-api
          annotations:
            summary: "backend-api: no requests for 5 minutes"
        - alert: MlApiHighErrorRate
          expr: |
            sum(rate(ml_api_requests_total{exported_endpoint!~"/health|/ready|/metrics", status=~"5.."}[5m]))
            /
            sum(rate(ml_api_requests_total{exported_endpoint!~"/health|/ready|/metrics"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
            service: ml-api
          annotations:
            summary: "ml-api: {{ $value | humanizePercentage }} of requests fail with 5xx"
        - alert: MlApiElevatedErrorRate
          expr: |
            sum(rate(ml_api_requests_total{exported_endpoint!~"/health|/ready|/metrics", status=~"5.."}[30m]))
            /
            sum(rate(ml_api_requests_total{exported_endpoint!~"/health|/ready|/metrics"}[30m]))
            > 0.01
          for: 5m
          labels:
            severity: warning
            service: ml-api
          annotations:
            summary: "ml-api: sustained {{ $value | humanizePercentage }} 5xx responses over 30m"
        - alert: MlApiHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(ml_api_request_duration_seconds_bucket{exported_endpoint!~"/health|/ready|/metrics"}[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
            service: ml-api
          annotations:
            summary: "ml-api: p95 request latency is {{ $value | humanizeDuration }}"
        - alert: MlApiNoTraffic
          expr: |
            sum(rate(ml_api_requests_total{exported_endpoint!~"/health|/ready|/metrics"}[5m])) == 0
            or
            absent(ml_api_requests_total{exported_endpoint!~"/health|/ready|/metrics"})
          for: 5m
          labels:
            severity: warning
            service: ml-api
          annotations:
            summary: "ml-api: no requests for 5 minutes"
    - name: service-pods
      rules:
        - alert: DeploymentNoReplicasAvailable
          expr: |
            kube_deployment_status_replicas_available{namespace="backend-api", deployment="backend-api"} == 0
            and
            kube_deployment_spec_replicas > 0
          for: 1m
          labels:
            severity: critical
            service: backend-api
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: no replicas available"
        - alert: DeploymentNoReplicasAvailable
          expr: |
            kube_deployment_status_replicas_available{namespace="ml-api", deployment="ml-api"} == 0
            and
            kube_deployment_spec_replicas > 0
          for: 1m
          labels:
            severity: critical
            service: ml-api
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: no replicas available"
        - alert: DeploymentNoReplicasAvailable
          expr: |
            kube_deployment_status_replicas_available{namespace="postgres", deployment="postgres"} == 0
            and
            kube_deployment_spec_replicas > 0
          for: 1m
          labels:
            severity: critical
            service: postgres
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: no replicas available"
        - alert: DeploymentDegraded
          expr: |
            kube_deployment_status_replicas_available{namespace="backend-api"}
            <
            kube_deployment_spec_replicas
          for: 5m
          labels:
            severity: warning
            service: backend-api
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: only {{ $value }} replicas available"
        - alert: DeploymentDegraded
          expr: |
            kube_deployment_status_replicas_available{namespace="ml-api"}
            <
            kube_deployment_spec_replicas
          for: 5m
          labels:
            severity: warning
            service: ml-api
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: only {{ $value }} replicas available"
        - alert: DeploymentDegraded
          expr: |
            kube_deployment_status_replicas_available{namespace="postgres"}
            <
            kube_deployment_spec_replicas
          for: 5m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }}: only {{ $value }} replicas available"
        - alert: MetricsTargetDown
          expr: |
            up{job="backend-api"} == 0
            or
            absent(up{job="backend-api"})
          for: 2m
          labels:
            severity: warning
            service: backend-api
          annotations:
            summary: "backend-api: {{ if $labels.pod }}metrics target {{ $labels.pod }} is down{{ else }}no metrics targets found{{ end }}"
        - alert: MetricsTargetDown
          expr: |
            up{job="ml-api"} == 0
            or
            absent(up{job="ml-api"})
          for: 2m
          labels:
            severity: warning
            service: ml-api
          annotations:
            summary: "ml-api: {{ if $labels.pod }}metrics target {{ $labels.pod }} is down{{ else }}no metrics targets found{{ end }}"
        - alert: MetricsTargetDown
          expr: |
            up{job="postgres-exporter-prometheus-postgres-exporter"} == 0
            or
            absent(up{job="postgres-exporter-prometheus-postgres-exporter"})
          for: 2m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: "postgres-exporter-prometheus-postgres-exporter: {{ if $labels.pod }}metrics target {{ $labels.pod }} is down{{ else }}no metrics targets found{{ end }}"
    - name: database
      rules:
        - alert: PostgresDown
          expr: |
            pg_up{namespace="postgres"} == 0
          for: 1m
          labels:
            severity: critical
            service: postgres
          annotations:
            summary: "postgres: the database does not accept connections"
    - name: service-resources
      rules:
        - alert: BackendApiMemoryNearLimit
          expr: |
            max by (namespace, pod) (
              max by (namespace, pod, container) (container_memory_working_set_bytes{namespace="backend-api", container="backend-api"})
              / on (namespace, pod, container)
              kube_pod_container_resource_limits{namespace="backend-api", container="backend-api", resource="memory"}
            ) > 0.85
          for: 2m
          labels:
            severity: warning
            service: backend-api
          annotations:
            summary: "backend-api: pod {{ $labels.pod }} uses {{ $value | humanizePercentage }} of its memory limit"
        - alert: BackendApiCpuNearLimit
          expr: |
            max by (namespace, pod) (
              max by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace="backend-api", container="backend-api"}[5m]))
              / on (namespace, pod, container)
              kube_pod_container_resource_limits{namespace="backend-api", container="backend-api", resource="cpu"}
            ) > 0.85
          for: 5m
          labels:
            severity: warning
            service: backend-api
          annotations:
            summary: "backend-api: pod {{ $labels.pod }} uses {{ $value | humanizePercentage }} of its CPU limit"
        - alert: BackendApiOomKilled
          expr: |
            max by (namespace, pod) (
              kube_pod_container_status_last_terminated_reason{namespace="backend-api", container="backend-api", reason="OOMKilled"} == 1
              and on (namespace, pod, container)
              increase(kube_pod_container_status_restarts_total{namespace="backend-api", container="backend-api"}[10m]) > 0
            )
          labels:
            severity: critical
            service: backend-api
          annotations:
            summary: "backend-api: pod {{ $labels.pod }} was killed for exceeding its memory limit"
        - alert: MlApiMemoryNearLimit
          expr: |
            max by (namespace, pod) (
              max by (namespace, pod, container) (container_memory_working_set_bytes{namespace="ml-api", container="ml-api"})
              / on (namespace, pod, container)
              kube_pod_container_resource_limits{namespace="ml-api", container="ml-api", resource="memory"}
            ) > 0.85
          for: 2m
          labels:
            severity: warning
            service: ml-api
          annotations:
            summary: "ml-api: pod {{ $labels.pod }} uses {{ $value | humanizePercentage }} of its memory limit"
        - alert: MlApiCpuNearLimit
          expr: |
            max by (namespace, pod) (
              max by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace="ml-api", container="ml-api"}[5m]))
              / on (namespace, pod, container)
              kube_pod_container_resource_limits{namespace="ml-api", container="ml-api", resource="cpu"}
            ) > 0.85
          for: 5m
          labels:
            severity: warning
            service: ml-api
          annotations:
            summary: "ml-api: pod {{ $labels.pod }} uses {{ $value | humanizePercentage }} of its CPU limit"
        - alert: MlApiOomKilled
          expr: |
            max by (namespace, pod) (
              kube_pod_container_status_last_terminated_reason{namespace="ml-api", container="ml-api", reason="OOMKilled"} == 1
              and on (namespace, pod, container)
              increase(kube_pod_container_status_restarts_total{namespace="ml-api", container="ml-api"}[10m]) > 0
            )
          labels:
            severity: critical
            service: ml-api
          annotations:
            summary: "ml-api: pod {{ $labels.pod }} was killed for exceeding its memory limit"
